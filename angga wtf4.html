<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Invoice Angga Waterproofing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* CSS tetap efisien dengan 3 warna: Biru, Navy, Putih */
        :root { --biru: #3498db; --navy: #2c3e50; --putih: #ffffff; }
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { background: var(--putih); padding: 30px; border-radius: 10px; max-width: 600px; margin: auto; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: var(--navy); color: var(--putih); padding: 15px; width: 100%; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Input Data Invoice</h2>
    <input type="text" id="klien" placeholder="Nama Klien">
    <input type="text" id="lokasi" placeholder="Alamat Proyek">
    <textarea id="terbilang" placeholder="Tuliskan Terbilang (Contoh: Sembilan Juta...)"></textarea>
    <button onclick="generateFinalPDF()">Generate Invoice Final</button>
</div>

<script>
    async function generateFinalPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // 1. Menambahkan Kop Surat
        // Pastikan file 'Kop Surat.jpg' dapat diakses. 
        // Jika testing, gunakan base64 dari gambar Anda.
        const imgData = 'Kop Surat.jpg'; 
        doc.addImage(imgData, 'JPEG', 10, 10, 190, 30);

        // 2. Konten Utama
        doc.setFontSize(12);
        doc.text("Kepada YTH: " + document.getElementById('klien').value, 20, 50);
        doc.text("Lokasi: " + document.getElementById('lokasi').value, 20, 57);

        // 3. Keterangan Terbilang
        doc.text("Terbilang:", 20, 70);
        doc.setFont("helvetica", "italic");
        doc.text(document.getElementById('terbilang').value, 20, 77);
        doc.setFont("helvetica", "normal");

        // 4. Informasi Rekening (Sesuai contoh)
        doc.setFillColor(52, 152, 219); // Biru
        doc.rect(20, 90, 170, 30, 'F');
        doc.setTextColor(255, 255, 255);
        doc.text("Pembayaran melalui Transfer", 25, 98);
        doc.text("Rekening BCA KCP Sunset Boulevard | Angga Hidayat", 25, 105);
        doc.text("No. Rekening: 7705280533", 25, 112);
        
        // 5. Tanda Tangan
        doc.setTextColor(0, 0, 0);
        doc.text("Hormat Kami,", 150, 140);
        doc.text("Angga Hidayat", 150, 160);

        doc.save("Invoice_Angga_Waterproofing_Final.pdf");
    }
</script>
</body>
</html>
